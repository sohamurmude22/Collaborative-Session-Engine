version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cse-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=collaborative-code-editor

  redis:
    image: redis:7.2-alpine
    container_name: cse-redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cse-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/collaborative-code-editor
      - REDIS_URL=redis://redis:6379
      - CLIENT_URL=http://localhost:5173
      - JWT_SECRET=collaborative_session_engine_secret_jwt_key_2026
    depends_on:
      - mongodb
      - redis

  frontend:
    build:
      context: ./Communication
      dockerfile: Dockerfile
    container_name: cse-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  mongo-data:
