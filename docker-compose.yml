services:
  postgres:
    image: postgres:16
    container_name: cse-postgres
    environment:
      POSTGRES_USER: cse
      POSTGRES_PASSWORD: cse_password
      POSTGRES_DB: cse
    ports:
      - "5432:5432"
    volumes:
      - cse-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: cse-redis
    ports:
      - "6379:6379"

volumes:
  cse-postgres-data:

