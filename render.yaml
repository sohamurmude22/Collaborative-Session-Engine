services:
  # ========================================================
  # Backend Web Service (Node.js + Express + WebSockets)
  # Deployed on Render | Paired with Vercel Frontend & MongoDB Atlas
  # ========================================================
  - type: web
    name: cse-backend
    runtime: node
    plan: free
    region: oregon # or ohio, frankfurt, singapore
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: REDIS_URL
        sync: false
