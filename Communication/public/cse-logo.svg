<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="cse-bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="cse-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#C084FC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0.7" />
    </linearGradient>

    <!-- Left Chevron (C) Gradient -->
    <linearGradient id="cse-c-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Center Bridge (S) Gradient -->
    <linearGradient id="cse-s-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Right Chevron (E) Gradient -->
    <linearGradient id="cse-e-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Radial Core Ambient Glow -->
    <radialGradient id="cse-core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.45" />
      <stop offset="60%" stop-color="#A855F7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="cse-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.5" />
    </filter>

    <filter id="cse-ambient-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect
    x="5"
    y="5"
    width="90"
    height="90"
    rx="24"
    fill="url(#cse-bg-grad)"
    stroke="url(#cse-border-grad)"
    stroke-width="2"
    filter="url(#cse-ambient-shadow)"
  />

  <!-- Ambient Internal Core Glow -->
  <circle cx="50" cy="50" r="38" fill="url(#cse-core-glow)" />

  <!-- Subtle Micro Circuit Grid / Quantum Lines -->
  <g opacity="0.18" stroke="#FFFFFF" stroke-width="0.8" stroke-dasharray="2 3">
    <line x1="20" y1="50" x2="80" y2="50" />
    <line x1="50" y1="20" x2="50" y2="80" />
    <circle cx="50" cy="50" r="22" fill="none" />
  </g>

  <!-- Left Glyph: Bracket 'C' (Collaborative / Code) -->
  <path
    d="M 38 27 L 23 46 C 21 48.5 21 51.5 23 54 L 38 73"
    fill="none"
    stroke="url(#cse-c-grad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cse-glow)"
  />

  <!-- Right Glyph: Bracket & Terminal Bars 'E' (Engine / Execution) -->
  <path
    d="M 62 27 L 77 46 C 79 48.5 79 51.5 77 54 L 62 73"
    fill="none"
    stroke="url(#cse-e-grad)"
    stroke-width="7"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#cse-glow)"
  />

  <!-- Right 'E' Middle Prong -->
  <line
    x1="58"
    y1="50"
    x2="73"
    y2="50"
    stroke="url(#cse-e-grad)"
    stroke-width="5"
    stroke-linecap="round"
    opacity="0.95"
  />

  <!-- Center Dynamic Stream / Synapse 'S' (Session / Synchronization) -->
  <path
    d="M 57 32 C 43 28 39 42 50 49 C 62 56 57 71 42 67"
    fill="none"
    stroke="url(#cse-s-grad)"
    stroke-width="5.5"
    stroke-linecap="round"
    filter="url(#cse-glow)"
  />

  <!-- Synapse Constellation Nodes -->
  <!-- Top Node -->
  <circle cx="57" cy="32" r="3" fill="#F43F5E" />
  <circle cx="57" cy="32" r="1.2" fill="#FFFFFF" />

  <!-- Center Nexus Node -->
  <circle cx="50" cy="49" r="2.8" fill="#A855F7" />
  <circle cx="50" cy="49" r="1.2" fill="#FFFFFF" />

  <!-- Bottom Node -->
  <circle cx="42" cy="67" r="3" fill="#818CF8" />
  <circle cx="42" cy="67" r="1.2" fill="#FFFFFF" />

  <!-- Apex Sparkle / Quantum Ping -->
  <circle cx="23" cy="23" r="1.8" fill="#38BDF8" opacity="0.8" />
  <circle cx="77" cy="77" r="1.8" fill="#34D399" opacity="0.8" />
</svg>
